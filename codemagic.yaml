workflows:
  unsigned-ios-ipa:
    name: Build Unsigned iOS IPA
    max_build_duration: 60
    environment:
      node: 18.x
      xcode: latest
    scripts:
      - name: Install Dependencies
        script: |
          npm install
      - name: Generate Native iOS Code
        script: |
          npx expo prebuild --platform ios --clean
      - name: Build Unsigned App
        script: |
          cd ios

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found in ios directory."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/ { found=1; next } found && NF { gsub(/^[ \t]+|[ \t]+$/, "", $0); print; exit }')
          if [ -z "$SCHEME" ]; then
            echo "No Xcode scheme found in workspace $WORKSPACE."
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build
      - name: Package into IPA
        script: |
          cd ios

          rm -rf Payload
          rm -f ../BookLoop.ipa
          mkdir -p Payload

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No .app file found in build/Build/Products/Release-iphoneos."
            exit 1
          fi

          cp -R "$APP_PATH" Payload/
          zip -r ../BookLoop.ipa Payload
    artifacts:
      - BookLoop.ipa
